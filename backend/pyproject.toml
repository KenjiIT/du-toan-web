[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "du-toan-web"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pyodbc>=5.0",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "reportlab>=4.0",
]
