[project]
name = "dutoan-mcp"
version = "0.1.0"
description = "MCP server cho phần mềm dự toán xây dựng"
requires-python = ">=3.12"
dependencies = ["mcp>=1.0.0", "httpx>=0.27.0"]

[project.scripts]
dutoan-mcp = "dutoan_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
